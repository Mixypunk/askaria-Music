name: Build AskaSound APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (ex: 1.2.0) — vide = auto'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Cache ~/.gradle/caches + ~/.gradle/wrapper : la distribution
          # Gradle n'est plus re-téléchargée à chaque run.
          cache: 'gradle'

      - name: Setup Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      # ── Version ───────────────────────────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          BUILD="${{ github.run_number }}"
          echo "version=$VERSION"                  >> $GITHUB_OUTPUT
          echo "build=$BUILD"                      >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"                     >> $GITHUB_OUTPUT
          echo "apk_name=AskaSound V$VERSION.apk"  >> $GITHUB_OUTPUT

      # ── Injecter version dans pubspec.yaml ────────────────────────────
      - name: Update pubspec version
        working-directory: swingapp
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      # ── Keystore : décoder depuis secret GitHub ───────────────────────
      - name: Setup keystore
        working-directory: swingapp/android
        run: |
          # Décoder la keystore Base64 stockée dans les secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/askasound.jks

          # Créer key.properties avec les infos de signature
          cat > key.properties << KEYEOF
          storeFile=../app/askasound.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          KEYEOF

          echo "Keystore prête : $(ls -lh app/askasound.jks)"

      # ── Dépendances Flutter ───────────────────────────────────────────
      # Nettoyage des artefacts générés (désormais ignorés par git) : évite de
      # réutiliser des sorties construites sur une autre machine.
      - name: Flutter clean
        working-directory: swingapp
        run: flutter clean

      - name: Flutter pub get
        working-directory: swingapp
        run: flutter pub get

      # ── Gradle : pré-téléchargement avec retry ────────────────────────
      # services.gradle.org redirige vers les releases GitHub, qui renvoient
      # parfois des 504 transitoires (déjà vu en CI). On télécharge la
      # distribution une seule fois, avec plusieurs tentatives ; le cache
      # Gradle de setup-java la réutilise ensuite d'un run à l'autre.
      - name: Prépare la distribution Gradle (retry)
        working-directory: swingapp/android
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5; do
            if ./gradlew --version > /dev/null 2>&1; then
              echo "Distribution Gradle prête."
              exit 0
            fi
            echo "Téléchargement Gradle échoué (tentative $i/5), nouvel essai dans 15 s…"
            sleep 15
          done
          echo "Erreur : impossible de télécharger Gradle après 5 tentatives."
          exit 1

      # ── Build APK signé ───────────────────────────────────────────────
      # 3 tentatives : les téléchargements Maven interrompus reprennent
      # depuis le cache Gradle (~/.gradle/caches), donc chaque essai
      # progresse. Un échec réseau transitoire ne casse plus la CI.
      - name: Build APK
        working-directory: swingapp
        run: |
          for attempt in 1 2 3; do
            echo "::group::Build APK - tentative $attempt/3"
            if flutter build apk --release \
                 --no-tree-shake-icons \
                 --build-name=${{ steps.version.outputs.version }} \
                 --build-number=${{ steps.version.outputs.build }}; then
              echo "::endgroup::"
              echo "Build APK réussi (tentative $attempt)."
              exit 0
            fi
            echo "::endgroup::"
            echo "Build échoué (tentative $attempt/3), nouvel essai dans 20 s…"
            sleep 20
          done
          echo "Erreur : le build APK a échoué après 3 tentatives."
          exit 1

      # ── Renommer l'APK ────────────────────────────────────────────────
      - name: Rename APK
        run: |
          SRC="swingapp/build/app/outputs/flutter-apk/app-release.apk"
          DST="swingapp/build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}"
          cp "$SRC" "$DST"
          echo "APK : $(du -sh $DST)"

      # ── Upload artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: swingapp/build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          retention-days: 30

      # ── Créer GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AskaSound ${{ steps.version.outputs.tag }}"
          body: |
            ## 🎵 AskaSound ${{ steps.version.outputs.tag }}
            Build : `${{ github.event.head_commit.message }}`

            ### 📱 Installation
            1. Télécharge **`${{ steps.version.outputs.apk_name }}`**
            2. Ouvre sur Android → Installer

            ### 🔄 Mise à jour automatique
            L'app détecte et installe les mises à jour automatiquement.
          files: swingapp/build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
