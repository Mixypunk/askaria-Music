org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# Réseau CI : les artefacts Maven passent par des redirections CDN parfois
# lentes. On allonge les timeouts et on multiplie les tentatives plutôt que
# de faire échouer tout le build sur un « Read timed out ».
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=1000

android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
