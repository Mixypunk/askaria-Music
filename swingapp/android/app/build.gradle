plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Lire les propriétés locales (versionCode / versionName injectés par Flutter)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// Lire les propriétés de signature (fichier local ou variables CI)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.mixypunk.askasound"
    compileSdk 34
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.mixypunk.askasound"
        minSdk 21
        targetSdk 34
        versionCode localProperties.getProperty("flutter.versionCode")?.toInteger() ?: 1
        versionName localProperties.getProperty("flutter.versionName") ?: "1.0"
    }

    signingConfigs {
        release {
            keyAlias     keystoreProperties["keyAlias"]     ?: System.getenv("KEY_ALIAS")
            keyPassword  keystoreProperties["keyPassword"]  ?: System.getenv("KEY_PASSWORD")
            storeFile    keystoreProperties["storeFile"]    ? file(keystoreProperties["storeFile"])
                         : (System.getenv("KEYSTORE_PATH")  ? file(System.getenv("KEYSTORE_PATH")) : null)
            storePassword keystoreProperties["storePassword"] ?: System.getenv("STORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
