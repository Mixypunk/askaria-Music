plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Lire les propriétés de signature (depuis fichier local ou variables CI)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// Lire la version depuis android/local.properties (écrit par `flutter build`).
// Compatible avec toutes les versions du plugin Gradle Flutter : selon la
// version, `flutter.versionCode` / `flutter.versionName` peut ne plus exister
// (Flutter 3.22 : méthodes `versionCode()` / `versionName()` au lieu de getters).
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.mixypunk.askasound"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            // Depuis fichier key.properties (local) ou variables env CI
            keyAlias     keystoreProperties['keyAlias']     ?: System.getenv('KEY_ALIAS')
            keyPassword  keystoreProperties['keyPassword']  ?: System.getenv('KEY_PASSWORD')
            storeFile    keystoreProperties['storeFile']    ? file(keystoreProperties['storeFile'])
                         : (System.getenv('KEYSTORE_PATH')  ? file(System.getenv('KEYSTORE_PATH')) : null)
            storePassword keystoreProperties['storePassword'] ?: System.getenv('STORE_PASSWORD')
        }
    }

    defaultConfig {
        applicationId "com.mixypunk.askasound"
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

