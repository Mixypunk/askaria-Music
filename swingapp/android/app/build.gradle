plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Lire les propriétés de signature (depuis fichier local ou variables CI)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.mixypunk.askasound"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            // Depuis fichier key.properties (local) ou variables env CI
            keyAlias     keystoreProperties['keyAlias']     ?: System.getenv('KEY_ALIAS')
            keyPassword  keystoreProperties['keyPassword']  ?: System.getenv('KEY_PASSWORD')
            storeFile    keystoreProperties['storeFile']    ? file(keystoreProperties['storeFile'])
                         : (System.getenv('KEYSTORE_PATH')  ? file(System.getenv('KEYSTORE_PATH')) : null)
            storePassword keystoreProperties['storePassword'] ?: System.getenv('STORE_PASSWORD')
        }
    }

    defaultConfig {
        applicationId "com.mixypunk.askasound"
        minSdk 21
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

