// ── Dépôts Maven ─────────────────────────────────────────────────────────
// Sur les runners CI, repo.maven.apache.org renvoie parfois une redirection
// vers github.com/.../releases/download/... qui expire (HTTP 504 / read
// timeout) sur les gros artefacts (ex: kotlin-compiler-embeddable-2.0.21.jar
// demandé par le buildscript de nsd_android).
// On place donc d'abord le miroir officiel Google de Maven Central, servi
// directement en 200 : mavenCentral() ne sert plus que de secours.
ext.mavenCentralMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

allprojects {
    repositories {
        google()
        maven { url rootProject.ext.mavenCentralMirror }
        mavenCentral()
    }
}

// Les plugins tiers (ex: nsd_android) déclarent leur PROPRE bloc buildscript
// avec `mavenCentral()` : les dépôts ci-dessus ne s'appliquent pas à leur
// classpath. On injecte le miroir avant l'évaluation de chaque sous-projet
// pour qu'il soit essayé en premier.
subprojects {
    beforeEvaluate { project ->
        project.buildscript.repositories {
            google()
            maven { url rootProject.ext.mavenCentralMirror }
        }

        if (project.name != 'app') {
            // Injecter un objet 'flutter' avec les valeurs SDK attendues par les vieux plugins
            project.extensions.extraProperties['flutter'] = new Expando()
            project.extensions.extraProperties['flutter'].minSdkVersion     = 21
            project.extensions.extraProperties['flutter'].targetSdkVersion  = 35
            project.extensions.extraProperties['flutter'].compileSdkVersion = 35
            project.extensions.extraProperties['flutter'].ndkVersion        = '27.0.12077973'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
